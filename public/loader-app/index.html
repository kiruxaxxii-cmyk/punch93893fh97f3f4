<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punch Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/loader.css" />
</head>
<body>
  <div class="fx" aria-hidden="true">
    <canvas id="rays" class="fx__rays"></canvas>
    <div class="fx__vignette"></div>
    <div class="fx__noise"></div>
  </div>

  <div class="shell" id="appShell">
    <header class="topbar">
      <div class="topbar__left">
        <div class="brand-chip" title="Punch">
          <img src="assets/punch-logo.jpg" alt="" />
        </div>
        <div class="user-card" id="userCard">
          <div class="user-card__avatar" id="userAvatar">P</div>
          <div class="user-card__meta">
            <strong id="userName">—</strong>
            <span id="userSub">Expired in: —</span>
          </div>
        </div>
      </div>
      <div class="topbar__right" data-no-drag>
        <button type="button" class="win-btn" onclick="post('minimize')" aria-label="Minimize">—</button>
        <button type="button" class="win-btn win-btn--close" onclick="post('close')" aria-label="Close">✕</button>
      </div>
    </header>

    <aside class="sidebar">
      <nav class="sidebar__nav">
        <button type="button" class="nav-btn is-active" id="navHome" data-view="home" title="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11.5 12 4l9 7.5"/><path d="M6.5 10.5V20h11V10.5"/></svg>
        </button>
        <button type="button" class="nav-btn" id="navSettings" data-view="settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </nav>
      <button type="button" class="nav-btn nav-btn--logout" id="navLogout" title="Logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </aside>

    <main class="content">
      <!-- AUTH -->
      <section class="view view--auth is-active" id="view-auth">
        <div class="auth-panel reveal">
          <img class="auth-logo" src="assets/punch-logo.jpg" alt="Punch" />
          <h1>Punch</h1>
          <p class="lead">Войди, чтобы запускать клиент и синхронизироваться с сайтом.</p>
          <form id="authForm" class="form" autocomplete="on">
            <label class="field">
              <span>Логин или почта</span>
              <input id="authLogin" name="login" placeholder="punchadmin" required />
            </label>
            <label class="field">
              <span>Пароль</span>
              <input id="authPass" name="password" type="password" placeholder="••••••••" required />
            </label>
            <div class="yacaptcha" id="yacaptcha" data-status="loading">
              <div class="yacaptcha__row">
                <button type="button" class="yacaptcha__box" id="yaBox" aria-label="Verify"></button>
                <div class="yacaptcha__label" id="yaLabel">Загрузка…</div>
                <div class="yacaptcha__logo">Yacaptcha</div>
              </div>
              <div class="yacaptcha__meta">
                <a class="yacaptcha__protected" href="https://t.me/virtukid" target="_blank" rel="noreferrer">protected by virtukid</a>
              </div>
              <p class="yacaptcha__err" id="yaErr" hidden></p>
            </div>
            <p class="form-error" id="authError" hidden></p>
            <button type="submit" class="btn btn--primary btn--block" id="authSubmit">Войти</button>
          </form>
          <button type="button" class="btn btn--ghost btn--block" id="authSiteBtn">Войти через сайт</button>
          <p class="hint" id="authSiteStatus"></p>
        </div>
      </section>

      <!-- HOME / MAINMENU -->
      <section class="view view--home" id="view-home">
        <div class="versions reveal">
          <article class="ver-card ver-card--solo" data-version="1.21.4">
            <div class="ver-card__bg ver-card__bg--a"></div>
            <div class="ver-card__shade"></div>
            <div class="ver-card__meta">
              <h2>Minecraft 1.21.4</h2>
              <p>Punch</p>
            </div>
            <button type="button" class="play-btn" data-launch="1.21.4" aria-label="Play">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </article>
        </div>
      </section>

      <!-- SETTINGS -->
      <section class="view view--settings" id="view-settings">
        <div class="settings reveal">
          <div class="panel">
            <div class="panel__head">
              <span>RAM</span>
              <strong id="ramValue">4096mb</strong>
            </div>
            <input type="range" id="ramSlider" min="2048" max="16384" step="512" value="4096" />
          </div>
          <div class="panel panel--row">
            <div>
              <span class="panel__label">Client Resources</span>
              <p class="panel__hint">Папка клиента и кэш лоудера</p>
            </div>
            <button type="button" class="btn btn--soft" id="btnOpenFolder">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg>
              Open Folder
            </button>
          </div>
          <div class="panel">
            <label class="field">
              <span>Никнейм</span>
              <input id="nickInput" maxlength="16" />
            </label>
            <button type="button" class="btn btn--primary" id="btnSaveSettings" style="margin-top:14px">Сохранить</button>
          </div>
        </div>
      </section>

      <!-- LAUNCH OVERLAY -->
      <section class="view view--launch" id="view-launch">
        <div class="launch reveal">
          <div class="launch__ring">
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="52" class="launch__track" />
              <circle cx="60" cy="60" r="52" class="launch__progress" id="launchProgress" />
            </svg>
            <span id="launchPercent">0%</span>
          </div>
          <h2 id="launchTitle">Loading</h2>
          <p id="launchStatus">Preparing…</p>
          <button type="button" class="btn btn--ghost" id="btnCancelLaunch">Отмена</button>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status">
    <strong id="toastTitle"></strong>
    <span id="toastDesc"></span>
  </div>

  <script src="js/rays.js"></script>
  <script src="js/loader.js"></script>
</body>
</html>
